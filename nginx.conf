server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # API routes. Exact or prefix matches only, so frontend routes such as
    # /report/<id> and /history are never proxied.
    location = /scan          { proxy_pass http://cipherguard-api:4000; }
    location = /scans         { proxy_pass http://cipherguard-api:4000; }
    location ^~ /scan/        { proxy_pass http://cipherguard-api:4000; }
    location = /scan-results  { proxy_pass http://cipherguard-api:4000; }
    location = /scan-progress { proxy_pass http://cipherguard-api:4000; }
    location = /health        { proxy_pass http://cipherguard-api:4000; }
    location ^~ /api/ {
        proxy_pass http://cipherguard-api:4000;
        # Server-sent events: deliver each event as it is written.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
    location = /scan_stream {
        proxy_pass http://cipherguard-api:4000;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: everything else is index.html.
    location / {
        try_files $uri /index.html;
    }
}
